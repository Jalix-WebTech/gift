<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(2deg); }
            75% { transform: translateY(10px) rotate(-2deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(239, 68, 68, 0.5), 0 0 40px rgba(239, 68, 68, 0.3); }
            50% { text-shadow: 0 0 40px rgba(239, 68, 68, 0.9), 0 0 80px rgba(239, 68, 68, 0.6), 0 0 120px rgba(239, 68, 68, 0.3); }
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        @keyframes emoji-rain {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .floating-text {
            animation: float 3s ease-in-out infinite, pulse-glow 2s ease-in-out infinite;
        }
        .shake-on-hover:hover {
            animation: shake 0.5s ease-in-out;
        }
        .emoji-particle {
            position: fixed;
            pointer-events: none;
            animation: emoji-rain linear forwards;
            font-size: 2rem;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative" style="background: linear-gradient(135deg, #0f0f0f, #1a0000, #0f0f0f, #1a0000); background-size: 300% 300%; animation: bg-shift 8s ease-in-out infinite;">

    <!-- Emoji rain container -->
    <div id="emoji-container"></div>

    <!-- Main content -->
    <div class="relative z-10 text-center px-4 select-none">
        <h1 class="floating-text shake-on-hover text-8xl md:text-[10rem] lg:text-[12rem] font-black text-red-500 cursor-pointer transition-all duration-300 hover:scale-110"
            style="font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: -0.02em;">
            fuck you Peace <br>

            don't try this again, I "Felix" warning you 
        </h1>
        <p class="mt-8 text-red-400/50 text-lg md:text-xl font-mono tracking-widest">
            ✦ ✦ ✦
        </p>
    </div>

    <script>
        // Emoji rain effect
        const emojis = ['🖕','😡', '👊', '💔', '⚡', '👺', '👹', '👾', '👽', '🤖', '☠️', '👻', '👹', '🤢', '🗿'];
        const container = document.getElementById('emoji-container');

        function createEmoji() {
            const emoji = document.createElement('span');
            emoji.className = 'emoji-particle';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.animationDuration = (Math.random() * 4 + 4) + 's';
            emoji.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
            emoji.style.opacity = Math.random() * 0.4 + 0.1;
            container.appendChild(emoji);

            // Remove after animation
            setTimeout(() => {
                emoji.remove();
            }, 8000);
        }

        // Spawn emojis periodically
        setInterval(createEmoji, 400);

        // Initial burst
        for (let i = 0; i < 15; i++) {
            setTimeout(createEmoji, i * 150);
        }

        // Click anywhere for a burst
        document.body.addEventListener('click', (e) => {
            // Don't burst if clicking on the main text (it shakes instead)
            if (e.target.tagName === 'H1') return;
            for (let i = 0; i < 10; i++) {
                setTimeout(createEmoji, i * 50);
            }
        });

        // Click on text for extra shake + burst
        document.querySelector('h1').addEventListener('click', (e) => {
            e.stopPropagation();
            for (let i = 0; i < 20; i++) {
                setTimeout(createEmoji, i * 30);
            }
        });
    </script>
</body>
</html>
